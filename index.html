<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SET">
  <meta name="theme-color" content="#F2F2F7">
  <title>SET - Classic 2-Minute Sprint</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      box-sizing: border-box;
    }

    html, body {
      position: fixed;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      background-color: #F2F2F7;
      color: #1C1C1E;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Screen height fixing for iOS Safari safe areas */
    .app-viewport {
      width: 100%;
      height: 100%;
      max-height: 100dvh;
      overflow: hidden;
      touch-action: none;
      padding-top: env(safe-area-inset-top, 16px);
      padding-bottom: env(safe-area-inset-bottom, 16px);
      padding-left: env(safe-area-inset-left, 16px);
      padding-right: env(safe-area-inset-right, 16px);
    }

    /* Card tile selection transitions & shadows */
    .set-tile {
      transition: transform 0.12s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.12s ease, border-color 0.12s ease;
      touch-action: none;
    }

    .set-tile:active {
      transform: scale(0.95);
    }

    .tile-selected {
      border-color: #007AFF !important;
      border-width: 3.5px !important;
      background-color: rgba(0, 122, 255, 0.08) !important;
      box-shadow: 0 4px 14px rgba(0, 122, 255, 0.25);
    }

    .tile-flash-success {
      animation: flash-green 0.35s ease;
    }

    @keyframes flash-green {
      0% { transform: scale(1); }
      50% { transform: scale(1.06); border-color: #34C759; background-color: rgba(52, 199, 89, 0.15); }
      100% { transform: scale(1); }
    }

    .tile-shake-error {
      animation: shake 0.32s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
  </style>
</head>

      </pattern>
    </defs>
  </svg>
