<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SET</title>
  
  <!-- iOS Standalone Web App Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SET">
  <meta name="theme-color" content="#121214">
  <link rel="apple-touch-icon" href="icon.png">

  <style>
    :root {
      --bg: #121214;
      --card-bg: #1c1c1e;
      --card-selected-bg: #2c2c30;
      --text: #f5f5f7;
      --text-sub: #86868b;
      --accent-red: #ee2a24;
      --accent-green: #00a651;
      --accent-purple: #7c287d;
      --blue: #0a84ff;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    /* Lock down scrolling, rubber-banding, and bounce */
    html, body {
      position: fixed;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .screen {
      width: 100%;
      max-width: 420px;
      height: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      padding: env(safe-area-inset-top, 24px) 20px env(safe-area-inset-bottom, 24px) 20px;
      touch-action: none;
    }

    .hidden { display: none !important; }

    /* Home Screen */
    #home-screen {
      align-items: center;
      justify-content: space-around;
      text-align: center;
    }

    .title-banner h1 {
      font-size: 4rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--accent-red);
      line-height: 1;
    }

    .title-banner p {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-sub);
      margin-top: 8px;
    }

    .preview-row {
      display: flex;
      gap: 16px;
      justify-content: center;
      width: 100%;
    }

    .preview-card {
      width: 72px;
      height: 72px;
      background: var(--card-bg);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .high-score-box {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 12px 28px;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .high-score-box span {
      display: block;
      font-size: 0.75rem;
      letter-spacing: 1px;
      font-weight: 700;
      color: var(--text-sub);
    }

    .high-score-box strong {
      font-size: 1.4rem;
      font-weight: 800;
    }

    .btn-primary {
      width: 100%;
      padding: 16px;
      background: var(--accent-green);
      color: #fff;
      font-size: 1.25rem;
      font-weight: 700;
      border: none;
      border-radius: 18px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 166, 81, 0.35);
      touch-action: manipulation;
    }

    .btn-primary:active { transform: scale(0.97); }

    /* Game Screen */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 8px 0;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 1.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 8px;
      touch-action: manipulation;
    }

    .score-badge {
      font-size: 1.25rem;
      font-weight: 800;
    }

    .timer-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 1.15rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      padding-left: 2px;
      margin-bottom: 8px;
    }

    .timer-wrap.urgent { color: var(--accent-red); }

    /* Grid */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      aspect-ratio: 1;
      touch-action: none;
    }

    .grid-tile {
      background: var(--card-bg);
      border-radius: 16px;
      border: 2px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      touch-action: none;
      transition: border-color 0.1s ease, background 0.1s ease;
    }

    .grid-tile.selected {
      border-color: var(--blue);
      background: var(--card-selected-bg);
    }

    .available-badge {
      align-self: center;
      background: var(--card-bg);
      border: 1px solid rgba(255,255,255,0.06);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-sub);
      margin-top: 8px;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 10;
      touch-action: none;
    }

    .modal-card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 28px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .modal-card h2 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .modal-card p {
      font-size: 1.15rem;
      color: var(--text-sub);
      margin-bottom: 24px;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
    }

    .modal-actions button {
      flex: 1;
      padding: 12px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 14px;
      border: none;
      cursor: pointer;
    }

    .btn-secondary {
      background: #2c2c30;
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- Striped SVG Patterns -->
  <svg style="position: absolute; width: 0; height: 0; overflow: hidden;" aria-hidden="true">
    <defs>
      <pattern id="stripe-red" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="0" y2="8" stroke="#ee2a24" stroke-width="2.5" />
      </pattern>
      <pattern id="stripe-green" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="0" y2="8" stroke="#00a651" stroke-width="2.5" />
      </pattern>
      <pattern id="stripe-purple" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="0" y2="8" stroke="#7c287d" stroke-width="2.5" />
      </pattern>
    </defs>
  </svg>

  <!-- Home Screen -->
  <div id="home-screen" class="screen">
    <div class="title-banner">
      <h1>SET</h1>
      <p>Classic 2-Minute Sprint</p>
    </div>

    <div class="preview-row" id="preview-row"></div>

    <div class="high-score-box">
      <span>HIGH SCORE</span>
      <strong id="high-score-display">0 Sets</strong>
    </div>

    <button class="btn-primary" id="btn-start">Play Game</button>
  </div>

  <!-- Game Screen -->
  <div id="game-screen" class="screen hidden">
    <div>
      <div class="top-bar">
        <button class="icon-btn" id="btn-exit">✕</button>
        <div class="score-badge" id="score-display">Sets: 0</div>
      </div>
      <div class="timer-wrap" id="timer-wrap">
        <span>⏱</span>
        <span id="timer-display">120s</span>
      </div>
    </div>

    <div class="grid-container" id="grid"></div>

    <div class="available-badge" id="available-count-display">0 Sets Available</div>
  </div>

  <!-- Game Over Modal -->
  <div id="modal-gameover" class="modal-overlay hidden">
    <div class="modal-card">
      <h2>Time's Up!</h2>
      <p id="modal-score">Sets Found: 0</p>
      <div class="modal-actions">
        <button class="btn-secondary" id="btn-modal-home">Home</button>
        <button class="btn-primary" id="btn-modal-restart" style="padding: 12px;">Play Again</button>
      </div>
    </div>
  </div>

    document.addEventListener('touchmove', function(e) {
      e.preventDefault();
    }, { passive: false });

    const SHAPES = ['circle', 'square', 'triangle'];
    const COLORS = ['red', 'green', 'purple'];
    const FILLS = ['solid', 'striped', 'outline'];

    const COLOR_HEX = {
      red: '#ee2a24',
      green: '#00a651',
      purple: '#7c287d'

    let deck = [];
    let board = [];
    let selectedIndices = [];
    let score = 0;
    let timeRemaining = 120;
    let timerInterval = null;
    let highScore = parseInt(localStorage.getItem('set_high_score') || '0', 10);

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();

      osc.connect(gain);
      gain.connect(audioCtx.destination);

        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      }
    }
