<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SET">
  <meta name="theme-color" content="#F2F2F7">
  <title>SET - Classic 2-Minute Sprint</title>
  <link rel="apple-touch-icon" href="icon.png">

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #F2F2F7;
      color: #1C1C1E;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      height: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: max(env(safe-area-inset-top), 16px) 16px max(env(safe-area-inset-bottom), 16px) 16px;
      position: relative;
    }

    .hidden { display: none !important; }

    /* Home Screen */
    #home-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100%;
      text-align: center;
      padding: 24px 0 12px 0;
    }

    .home-header h1 {
      font-size: 4.5rem;
      font-weight: 900;
      letter-spacing: -1px;
      color: #EE2A24;
      line-height: 1;
    }

    .home-header p {
      font-size: 0.85rem;
      font-weight: 700;
      color: #8E8E93;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 8px;
    }

    .preview-box {
      display: flex;
      gap: 16px;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      padding: 16px 20px;
      border-radius: 20px;
      border: 1px solid rgba(0,0,0,0.06);
      box-shadow: 0 4px 16px rgba(0,0,0,0.04);
    }

    .preview-tile {
      width: 60px;
      height: 60px;
    }

    .highscore-card {
      background: white;
      border-radius: 16px;
      padding: 12px 28px;
      border: 1px solid rgba(0,0,0,0.06);
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    .highscore-card span {
      display: block;
      font-size: 0.7rem;
      font-weight: 700;
      color: #8E8E93;
      letter-spacing: 1px;
    }

    .highscore-card strong {
      font-size: 1.4rem;
      font-weight: 800;
      color: #1C1C1E;
    }

    .btn-play {
      width: 100%;
      padding: 16px;
      font-size: 1.25rem;
      font-weight: 700;
      color: white;
      background: #00A651;
      border: none;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0, 166, 81, 0.3);
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .btn-play:active {
      transform: scale(0.97);
    }

    /* Game Screen */
    #game-screen {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      padding: 8px 0;
    }

    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0 4px;
    }

    .btn-exit {
      background: none;
      border: none;
      color: #8E8E93;
      font-size: 1.7rem;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
    }

    .score-label {
      font-size: 1.35rem;
      font-weight: 800;
      color: #1C1C1E;
    }

    .board-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .timer-row {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 0 4px;
      margin-bottom: 10px;
    }

    .timer-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: white;
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 12px;
      padding: 6px 12px;
      font-weight: 800;
      font-size: 1rem;
      font-variant-numeric: tabular-nums;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }

    .timer-pill.urgent {
      color: #EE2A24;
      border-color: rgba(238, 42, 36, 0.3);
    }

    /* 3x3 Grid Locked Down */
    .grid-board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      aspect-ratio: 1;
      touch-action: none; /* Prevents any finger drag from scrolling */
    }

    .tile {
      background: white;
      border-radius: 18px;
      border: 1.5px solid rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      touch-action: none;
      transition: transform 0.1s ease, border-color 0.1s ease, background 0.1s ease;
      padding: 8px;
    }

    .tile.selected {
      border: 3.5px solid #007AFF !important;
      background: rgba(0, 122, 255, 0.08);
      transform: scale(0.96);
    }

      background: rgba(255, 255,
